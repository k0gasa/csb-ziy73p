<html><head><base href="." /><title>Moved</title><style>
body {
    margin: 0;
    padding: 0;
    background-color: #111;
    color: #fff;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    line-height: 1.6;
    overflow: hidden; /* Prevent scrollbar from appearing */
}

.container {
    text-align: center;
}

.message {
    font-size: 1.5rem;
    font-weight: 300;
    letter-spacing: -0.5px;
    margin-bottom: 1rem;
    color: #fff;
}

.link {
    color: #e34a63;
    text-decoration: none;
    transition: opacity 0.3s ease;
    position: relative; /* Add this to properly position the underline */
    display: inline-block; /* Add this to contain the underline */
}

.link:hover {
    opacity: 0.7;
}

.link::after {
    content: '';
    position: absolute;
    width: 100%;
    height: 1px;
    bottom: -2px;
    left: 0;
    background-color: #e34a63;
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.3s ease;
}

.link:hover::after {
    transform: scaleX(1);
}
</style></head><body>
    <div class="container">
        <div class="message">
            Moved to <a href="https://k0gasa.github.io/items/" class="link">https://k0gasa.github.io/items/</a>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.querySelector('.container');
            container.style.opacity = 0;
            setTimeout(() => {
                container.style.transition = 'opacity 1s ease';
                container.style.opacity = 1;
            }, 100);
        });
    </script>
</body></html>
